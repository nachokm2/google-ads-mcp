# tools_config.yaml
#
# Tools configuration for the Google Ads MCP server.
# Modify this file to enable/disable tool namespaces or set custom prefixes.

namespaces:
  customers: true
  search: true
  metadata: true
  # Read-only reports: performance, search terms, budget pacing, asset
  # performance and recommendations.
  reports: true
  # Tools that modify Google Ads data. Disabled by default; use
  # tools_config_write.yaml to enable them.
  mutate: false
